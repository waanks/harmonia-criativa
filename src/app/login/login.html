<main class="container">
  <section class="modern-form-card">
    <div class="modern-form-header">
      <h2>Entrar</h2>
      <p>Acesse sua área de aluno ou administração.</p>
    </div>

<!--    <form id="loginForm">-->
      <div class="modern-form-grid">
        <div class="modern-field full">
          <label for="email">E-mail</label>
          <input id="email" type="email" placeholder="Digite seu e-mail" required />
        </div>

        <div class="modern-field full">
          <label for="password">Senha</label>
          <input id="password" type="password" placeholder="Digite sua senha" required />
        </div>
      </div>

      <div class="modern-actions">
        <button type="submit" class="modern-btn-primary">Entrar</button>
        <a routerLink="/registrar" class="modern-btn-secondary">Criar conta</a>
      </div>
    <!--    </form>-->
  </section>
</main>
