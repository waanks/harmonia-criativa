<main class="container">
  <section class="card">
    <h2>Pagamentos</h2>
    <p>Gere cobranças Pix para alunos cadastrados e acompanhe os pagamentos.</p>
  </section>

  <section class="card">
    <h2>Alunos</h2>

    <div class="table-wrapper">
      <table>
        <thead>
        <tr>
          <th>Aluno</th>
          <th>Curso</th>
          <th>Mensalidade</th>
          <th>Ação</th>
        </tr>
        </thead>
        <tbody id="studentsPaymentTableBody"></tbody>
      </table>
    </div>
  </section>

  <section class="card">
    <h2>Pix gerado</h2>

    <div id="paymentResult">
      <p>Nenhum Pix gerado ainda.</p>
    </div>
  </section>

  <section class="card">
    <h2>Histórico de pagamentos</h2>

    <div class="table-wrapper">
      <table>
        <thead>
        <tr>
          <th>Aluno</th>
          <th>Curso</th>
          <th>Valor</th>
          <th>Status</th>
          <th>Data</th>
        </tr>
        </thead>
        <tbody id="paymentsTableBody"></tbody>
      </table>
    </div>
  </section>
</main>
